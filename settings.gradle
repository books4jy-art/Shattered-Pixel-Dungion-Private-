pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

//core game code modules
include ':SPD-classes'
include ':core'

//platform modules
//pass -PwebOnly to skip the android and iOS modules, e.g. when building the web version without an Android SDK
if (!providers.gradleProperty('webOnly').present) {
    include ':android'
    include ':ios'
}
include ':desktop'
include ':web'

//service modules
include ':services'
    //updates
    include ':services:updates:debugUpdates'
    include ':services:updates:githubUpdates'
    //news
    include ':services:news:debugNews'
    include ':services:news:shatteredNews'